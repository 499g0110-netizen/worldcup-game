<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>合艾 HAT YAI · 電影級 3D 城市導覽</title>
<meta name="description" content="以真實座標（OpenStreetMap）重建的泰國合艾 3D 電影式導覽：由李花園廣場酒店向外，經市場、車站，到水上市場、公園與機場。">
<style>
:root{--ink:#f4efe6;--dim:rgba(244,239,230,.62);--gold:#e6c274;--glass:rgba(12,14,28,.52);--line:rgba(255,255,255,.14);--serif:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",Georgia,serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07070f;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* letterbox */
.bar{position:fixed;left:0;right:0;height:5.2vh;background:#000;z-index:5;pointer-events:none;transition:transform .8s}
.bar.t{top:0}.bar.b{bottom:0}
body.explore .bar.t{transform:translateY(-100%)}body.explore .bar.b{transform:translateY(100%)}
/* loader / intro */
#intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 30%,#2a1450 0%,#0a0814 60%,#05050b 100%);transition:opacity 1.2s,visibility 1.2s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro .in{text-align:center;max-width:640px;padding:24px}
#intro .k{letter-spacing:.5em;font-size:11px;color:var(--gold);margin-bottom:22px}
#intro h1{font-family:var(--serif);font-weight:600;font-size:clamp(54px,11vw,128px);letter-spacing:.14em;line-height:1;background:linear-gradient(180deg,#fff,#d9c392 70%,#a67f3a);-webkit-background-clip:text;color:transparent}
#intro h2{font-family:var(--serif);font-weight:400;font-size:clamp(14px,2.2vw,20px);letter-spacing:.34em;margin:14px 0 6px;color:var(--ink)}
#intro p{color:var(--dim);font-size:13px;line-height:1.9;margin:20px auto 30px;max-width:520px}
#loader{width:260px;margin:0 auto 18px;transition:opacity .6s}
#loader.done{opacity:0;height:0;margin:0;overflow:hidden}
#ld-track{height:2px;background:rgba(255,255,255,.14);overflow:hidden}
#ld-bar{height:100%;width:0;background:linear-gradient(90deg,#c9a24f,#fff3c9);transition:width .3s}
#ld-txt{font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:.12em}
#start{padding:14px 34px;border:1px solid rgba(230,194,116,.6);color:var(--ink);letter-spacing:.3em;font-size:13px;background:rgba(230,194,116,.08);transition:.3s;border-radius:2px}
#start:disabled{opacity:.25;cursor:default}
#start:not(:disabled):hover{background:rgba(230,194,116,.22);letter-spacing:.38em}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .5s}
body.ui-off #hud{opacity:0}
#hud *{pointer-events:auto}
.brand{position:absolute;left:clamp(16px,3vw,44px);top:calc(5.2vh + 18px);font-size:11px;letter-spacing:.32em;color:var(--dim)}
.brand b{display:block;font-family:var(--serif);font-size:16px;letter-spacing:.3em;color:var(--ink);font-weight:600;margin-bottom:3px}
#card{position:absolute;left:clamp(16px,3vw,44px);bottom:calc(5.2vh + 96px);max-width:min(440px,calc(100vw - 32px));padding:22px 24px 20px;background:linear-gradient(135deg,rgba(14,16,32,.62),rgba(14,16,32,.34));backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:3px;opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s}
#card.in{opacity:1;transform:none}
#c-idx{font-size:10px;letter-spacing:.34em;color:var(--gold)}
#c-zh{font-family:var(--serif);font-size:clamp(24px,3.2vw,34px);font-weight:600;margin:8px 0 4px;line-height:1.25}
#c-en{font-size:12px;letter-spacing:.1em;color:var(--dim)}
#c-desc{font-size:13px;line-height:1.85;margin-top:12px;color:rgba(244,239,230,.86)}
#c-tag{display:inline-block;margin-top:12px;font-size:10px;letter-spacing:.22em;padding:3px 9px;border:1px solid var(--line);color:var(--dim)}
#dist{position:absolute;right:clamp(16px,3vw,44px);top:calc(5.2vh + 18px);display:flex;gap:12px;align-items:center;text-align:right}
#dist small{display:block;font-size:10px;letter-spacing:.28em;color:var(--dim)}
#dist-val{font-family:var(--serif);font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
#dist-ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*360deg),rgba(255,255,255,.14) 0);-webkit-mask:radial-gradient(circle,transparent 17px,#000 18px);mask:radial-gradient(circle,transparent 17px,#000 18px)}
#minimap{position:absolute;right:clamp(16px,3vw,44px);top:calc(5.2vh + 82px);width:min(220px,40vw);height:auto;aspect-ratio:220/216;border:1px solid var(--line);border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#tl{position:absolute;left:clamp(16px,3vw,44px);right:clamp(16px,3vw,44px);bottom:calc(5.2vh + 20px);height:56px}
#tl-track{position:absolute;left:0;right:0;top:8px;height:3px;background:rgba(255,255,255,.18);cursor:pointer}
#tl-track:before{content:"";position:absolute;inset:-10px 0}
#tl-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#b98f3e,#ffe9ae);box-shadow:0 0 12px rgba(255,220,150,.7)}
#tl-dots{position:absolute;left:0;right:0;top:0}
.dot{position:absolute;top:-1px;transform:translateX(-50%);width:28px;height:28px;display:flex;flex-direction:column;align-items:center}
.dot i{width:9px;height:9px;border-radius:50%;background:#0b0c18;border:1.5px solid rgba(255,255,255,.7);margin-top:5px;transition:.3s}
.dot span{position:absolute;top:24px;white-space:nowrap;font-size:10px;letter-spacing:.12em;color:var(--dim);opacity:.0;transition:.3s;pointer-events:none}
.dot:hover span,.dot.on span{opacity:1}
.dot.on i{background:var(--gold);border-color:#fff;box-shadow:0 0 14px var(--gold);transform:scale(1.35)}
.dot.on span{color:var(--ink)}
#controls{position:absolute;right:clamp(16px,3vw,44px);bottom:calc(5.2vh + 82px);display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
#controls button{min-width:40px;height:36px;padding:0 13px;background:var(--glass);border:1px solid var(--line);border-radius:2px;font-size:12px;letter-spacing:.1em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.25s}
#controls button:hover{border-color:rgba(230,194,116,.7);background:rgba(230,194,116,.16)}
#controls button.on{background:rgba(230,194,116,.28);border-color:var(--gold)}
#controls .sep{width:1px;background:var(--line);margin:4px 3px}
#places{position:absolute;left:clamp(16px,3vw,44px);top:calc(5.2vh + 80px);display:none;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
body.explore #places{display:flex}body.explore #card{opacity:0!important}body.explore #tl{opacity:.35}
#places button{display:flex;justify-content:space-between;gap:18px;padding:8px 14px;background:var(--glass);border:1px solid var(--line);font-size:12px;min-width:210px;text-align:left;backdrop-filter:blur(10px)}
#places button small{color:var(--dim)}
#places button:hover{border-color:var(--gold)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:none;align-items:flex-start;gap:8px;pointer-events:none;will-change:transform}
.lbl i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(230,194,116,.25),0 0 14px var(--gold);margin:4px 0 0 -3px}
.lbl b{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-shadow:0 1px 6px #000,0 0 18px rgba(0,0,0,.7)}
.lbl small{display:block;font-size:10px;color:var(--dim);letter-spacing:.06em;text-shadow:0 1px 6px #000}
.lbl{flex-wrap:wrap;width:max-content}.lbl i{flex:none}.lbl b,.lbl small{flex-basis:calc(100% - 20px)}
.lbl{display:none}
footer{position:absolute;left:clamp(16px,3vw,44px);bottom:calc(5.2vh + 3px);font-size:9.5px;letter-spacing:.06em;color:rgba(244,239,230,.4);max-width:70vw}
footer a{color:inherit}
#c-story{margin-top:14px;display:block;padding:9px 14px;border:1px solid rgba(230,194,116,.6);background:rgba(230,194,116,.12);font-size:12px;letter-spacing:.18em;border-radius:2px}
#c-story:hover{background:rgba(230,194,116,.28)}
#story{position:fixed;inset:0;z-index:40;background:#0b0710;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
#story.on{opacity:1;visibility:visible}
#story canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block}
#story .st-title{position:absolute;top:calc(50% - min(28.1vw,50vh) + 34px);left:calc(50% - min(50vw,88.9vh) + 44px);font-family:var(--serif);text-shadow:0 2px 12px rgba(0,0,0,.6)}
#story .st-title b{display:block;font-size:clamp(20px,3vw,36px);letter-spacing:.12em}
#story .st-title small{font-size:13px;letter-spacing:.2em;color:#f1deb0}
#story .st-sub{position:absolute;bottom:calc(50% - min(28.1vw,50vh) + 46px);left:50%;transform:translateX(-50%);max-width:80vw;text-align:center;font-family:var(--serif);font-size:clamp(14px,1.8vw,21px);letter-spacing:.08em;padding:8px 18px;background:rgba(10,6,16,.45);border-radius:2px;opacity:0;transition:opacity 1s}
#story .st-sub.in{opacity:1}
#story .st-ctl{position:absolute;top:16px;right:16px;display:flex;gap:6px}
#story .st-ctl button{height:34px;padding:0 12px;background:rgba(12,14,28,.6);border:1px solid var(--line);font-size:12px}
#story .st-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}#story .st-bar i{display:block;height:100%;width:0;background:var(--gold)}
@media (max-width:760px){#minimap{display:none}#card{bottom:calc(5.2vh + 130px);padding:16px 18px}#c-desc{font-size:12px}#controls{bottom:calc(5.2vh + 74px);justify-content:flex-start;left:16px}.dot span{display:none}#dist{top:calc(5.2vh + 14px)}}
</style>
</head>

<canvas id="c"></canvas>
<div class="bar t"></div><div class="bar b"></div>

<div id="intro">
  <div class="in">
    <div class="k">CINEMATIC CITY GUIDE · 7.0058°N 100.4717°E</div>
    <h1>合艾</h1>
    <h2>HAT YAI &nbsp;·&nbsp; หาดใหญ่</h2>
    <p>以 OpenStreetMap 的真實座標重建。從李花園廣場酒店出發，由市中心向外：石板街、Kim Yong 市場、火車總站，一路飛到水上市場、山丘公園與機場。</p>
    <div id="loader"><div id="ld-track"><div id="ld-bar"></div></div><div id="ld-txt">準備中…</div></div>
    <button id="start" disabled>載入中</button>
  </div>
</div>

  <div id="places"></div>

    <button id="btn-prev" title="上一站 (←)">◀</button><button id="btn-play" title="播放/暫停 (空白鍵)">❚❚</button><button id="btn-next" title="下一站 (→)">▶</button>
    <span class="sep"></span>

  </div>
  <div id="tl"><div id="tl-track"><div id="tl-fill"></div><div id="tl-dots"></div></div></div>
  <div id="labels"></div>
  <footer>地圖資料 © OpenStreetMap contributors (ODbL)。建築高度與立面為依照片與街景估計的藝術重建，非精確測繪。</footer>
</div>
