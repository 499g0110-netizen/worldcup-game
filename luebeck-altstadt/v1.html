<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lübeck Altstadt</title>
<meta name="description" content="在即時運算的 3D 德國呂貝克舊城區裡自由走動。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen WebGL world; translucent "paper" HUD panels pinned to the corners. Single look by design (a game view). */
:root {
  --ink: #1d1a17;
  --paper: #f3efe6;
  --brick: #a8432a;
  --copper: #6fae95;
  --slate: #3a3d42;
  --veil: rgba(243, 239, 230, 0.88);
  --line: rgba(29, 26, 23, 0.14);
  --f-title: "UnifrakturMaguntia", "Noto Sans TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb2d6; color: var(--ink); font-family: var(--f-body); }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.panel { position: fixed; z-index: 5; background: var(--veil); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.12); }
#title { top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(14px, env(safe-area-inset-left, 0px)); padding: 10px 14px; }
#title h1 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: 30px; line-height: 1; color: var(--brick); }
#title .sub { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #5b5550; margin-top: 4px; }
#title .clock { font-family: var(--f-mono); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }

#mapBox { top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px)); padding: 6px; }
#mini { display: block; width: 168px; height: 168px; border-radius: 6px; }
#mapBox .cap { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-align: center; margin-top: 4px; color: #5b5550; }

#place { left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); max-width: min(380px, calc(100vw - 28px));
  padding: 14px 16px; opacity: 0; transform: translateY(10px); transition: opacity .6s, transform .6s; pointer-events: none; }
#place.on { opacity: 1; transform: none; }
#place .de { font-family: var(--f-title); font-size: 26px; color: var(--brick); line-height: 1.1; }
#place .zh { font-weight: 700; font-size: 15px; margin-top: 2px; }
#place .yr { font-family: var(--f-mono); font-size: 11px; color: #5b5550; margin-top: 2px; }
#place p { margin: 8px 0 0; font-size: 13px; line-height: 1.65; }

#tools { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 28px); }
.tb { all: unset; cursor: pointer; font-family: var(--f-mono); font-size: 11.5px; padding: 8px 11px; border-radius: 7px; color: var(--ink); white-space: nowrap; }
.tb:hover, .tb:focus-visible { background: rgba(168, 67, 42, .12); }
.tb:focus-visible { outline: 2px solid var(--brick); }
.tb kbd { font-family: inherit; font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; color: #6b645d; }

#bigmap { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(20,18,16,.55); }
#bigmap.on { display: grid; }
#bigmap .wrap { position: relative; width: min(94vw, 1100px); }
#bigmap img { width: 100%; display: block; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
#bigmap .dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--brick); border: 2px solid #fff; box-shadow: 0 0 0 6px rgba(168,67,42,.3); }
#bigmap .lbl { position: absolute; transform: translate(-50%, -130%); font-size: 11px; font-weight: 700; background: var(--veil); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
#bigmap .hint { color: #fff; font-family: var(--f-mono); font-size: 11px; text-align: center; margin-top: 10px; }

/* intro */
#intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: linear-gradient(180deg, rgba(30,26,22,.35), rgba(30,26,22,.7));
  padding: 16px max(16px, env(safe-area-inset-left, 0px)); transition: opacity .8s, visibility .8s; }
#intro.off { opacity: 0; visibility: hidden; }
#intro .card { background: var(--paper); border-radius: 14px; padding: 28px 28px 24px; max-width: 520px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
#intro h2 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: clamp(44px, 9vw, 64px); line-height: 1; color: var(--brick); }
#intro .lead { margin: 10px 0 18px; font-size: 14px; line-height: 1.7; }
#intro table { width: 100%; border-collapse: collapse; font-size: 13px; }
#intro td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
#intro td:first-child { font-family: var(--f-mono); font-size: 12px; width: 44%; color: #5b5550; }
#go { all: unset; cursor: pointer; display: block; margin-top: 20px; text-align: center; padding: 13px; border-radius: 9px; background: var(--brick); color: #fff; font-weight: 700; letter-spacing: .08em; }
#go[disabled] { opacity: .5; cursor: progress; }
#go:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#status { font-family: var(--f-mono); font-size: 11px; text-align: center; margin-top: 10px; color: #5b5550; min-height: 1.2em; }
.touch-only { display: none; }
body.touch .touch-only { display: table-row; }
body.touch .desk-only { display: none; }

/* touch controls */
#stick { position: fixed; z-index: 6; left: max(22px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); width: 120px; height: 120px; border-radius: 50%;
  background: rgba(243,239,230,.35); border: 1px solid rgba(255,255,255,.6); display: none; touch-action: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(243,239,230,.9); }
body.touch #stick { display: block; }
body.touch #place { bottom: calc(env(safe-area-inset-bottom, 0px) + 260px); }
@media (max-width: 600px) { #mini { width: 112px; height: 112px; } #title h1 { font-size: 24px; } .tb kbd { display: none; } }
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="3D 呂貝克舊城：用方向鍵或 WASD 走動"></canvas>

<div class="panel" id="title"><h1>Lübeck</h1><div class="sub">Altstadt · UNESCO 1987</div><div class="clock" id="clock">17:00 · 午後</div></div>
<div class="panel" id="mapBox"><canvas id="mini" width="336" height="336"></canvas><div class="cap">N ↑ · M 大地圖</div></div>
<div class="panel" id="place" aria-live="polite"><div class="de" id="pDe"></div><div class="zh" id="pZh"></div><div class="yr" id="pYr"></div><p id="pTx"></p></div>
<div class="panel" id="tools">
  <button class="tb" id="bTime" type="button">時間<kbd>T</kbd></button>
  <button class="tb" id="bView" type="button">視角<kbd>V</kbd></button>
  <button class="tb" id="bMap" type="button">地圖<kbd>M</kbd></button>
  <button class="tb" id="bRun" type="button">奔跑<kbd>Shift</kbd></button>
  <button class="tb" id="bHelp" type="button">說明<kbd>H</kbd></button>
</div>
<div id="stick"><i></i></div>

<div id="bigmap"><div class="wrap"><img src="assets/aerial.jpg" alt="呂貝克舊城空拍圖"><div class="dot" id="bigDot"></div><div class="hint">M 或點一下關閉</div></div></div>

<div id="intro"><div class="card">
  <h2>Lübeck</h2>
  <p class="lead">漢薩同盟之后，特拉沃河環抱的磚造舊城。這是一個沒有時間限制的開放空間：走過霍爾斯滕門、鹽倉、聖母教堂和市政廳，街上有行人、單車和汽車，河上有船，城外草地的風車一直在轉。</p>
  <table>
    <tr class="desk-only"><td>W A S D／方向鍵</td><td>走路</td></tr>
    <tr class="desk-only"><td>Shift</td><td>奔跑（按住）</td></tr>
    <tr class="desk-only"><td>滑鼠拖曳／滾輪</td><td>轉動鏡頭／拉近拉遠</td></tr>
    <tr class="desk-only"><td>空白鍵</td><td>跳</td></tr>
    <tr class="touch-only"><td>左下搖桿</td><td>走路，推到底就是跑</td></tr>
    <tr class="touch-only"><td>畫面其他地方滑動</td><td>轉動鏡頭</td></tr>
    <tr><td>T · V · M</td><td>切換時間 · 第一／第三人稱 · 大地圖</td></tr>
  </table>
  <button id="go" type="button" disabled>進入舊城</button>
  <div id="status">正在載入 Three.js…</div>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (s) => document.querySelector(s);
const status = (t) => { $('#status').textContent = t; };
const TOUCH = matchMedia('(pointer: coarse)').matches;
const MOBILE = TOUCH || innerWidth < 760;
if (TOUCH) document.body.classList.add('touch');
const D2R = Math.PI / 180;

/* ---------------- deterministic RNG: same city every visit ---------------- */
let seed = 1143;                 // Lübeck founded 1143
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const rr = (a, b) => a + (b - a) * rnd();
const pick = (a) => a[Math.floor(rnd() * a.length)];
const lin = (hex) => new THREE.Color(hex);

/* =====================================================================
 * GEOGRAPHY — world metres; 1 m ≈ 1 px of the aerial photo, origin at
 * the island centre (photo px 760, 495). North = −z.
 * ===================================================================== */
const RX = 330, RZN = 450, RZS = 420, SEN = 2.4;
function islandR(phi) {
  const c = Math.abs(Math.cos(phi)), s = Math.sin(phi), rz = s < 0 ? RZN : RZS;
  return 1 / Math.pow(Math.pow(c / RX, SEN) + Math.pow(Math.abs(s) / rz, SEN), 1 / SEN);
}
const riverW = (phi) => 72 - 16 * Math.cos(phi) + 8 * Math.sin(2 * phi);
const outerR = (phi) => islandR(phi) + riverW(phi);
const ROAD0 = 40, ROAD1 = 52;    // ring road band, measured outward from the outer bank
const polarPt = (phi, r) => [Math.cos(phi) * r, Math.sin(phi) * r];
const yawInward = (phi) => Math.atan2(Math.cos(phi), Math.sin(phi)); // local −z faces the island centre

const BRIDGES = [
  { phi: 137, w: 14 }, { phi: -90, w: 12 }, { phi: -40, w: 8 }, { phi: 10, w: 9 },
  { phi: 55, w: 8 }, { phi: 103, w: 9 }, { phi: -158, w: 9 },
].map((b) => {
  const p = b.phi * D2R, r = islandR(p), R = outerR(p);
  const a = polarPt(p, r - 8), e = polarPt(p, R + ROAD0 + 2);
  return { ...b, p, a, e, len: Math.hypot(e[0] - a[0], e[1] - a[1]) };
});
function onBridge(x, z) {
  for (const b of BRIDGES) {
    const dx = b.e[0] - b.a[0], dz = b.e[1] - b.a[1], L2 = dx * dx + dz * dz;
    const t = ((x - b.a[0]) * dx + (z - b.a[1]) * dz) / L2;
    if (t < 0 || t > 1) continue;
    const px = b.a[0] + dx * t - x, pz = b.a[1] + dz * t - z;
    if (px * px + pz * pz < (b.w / 2 - 0.6) ** 2) return true;
  }
  return false;
}
function walkable(x, z) {
  const d = Math.hypot(x, z), phi = Math.atan2(z, x);
  if (d < islandR(phi) - 1.2) return true;
  if (d > outerR(phi) + 1.2) return d < 1350;
  return onBridge(x, z);
}

/* =====================================================================
 * RENDERER / SCENE / CAMERA
 * ===================================================================== */
const canvas = $('#world');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { status('這個瀏覽器無法啟用 WebGL，請改用較新的 Chrome、Edge 或 Safari。'); throw e; }
const DPR = Math.min(devicePixelRatio, MOBILE ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9c8d8, 260, 1500);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 9000);

/* =====================================================================
 * PROCEDURAL TEXTURES (no image downloads — everything is drawn here)
 * ===================================================================== */
function tex(w, h, draw, { srgb = true, repeat = true } = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAXANISO;
  return t;
}
// tileable value noise
function vnoise(x, y, p) {
  const h = (i, j) => { i = ((i % p) + p) % p; j = ((j % p) + p) % p; const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v;
}
const fbm = (x, y, p, o = 5) => { let a = 0, s = 0.5, f = 1; for (let i = 0; i < o; i++) { a += vnoise(x * f, y * f, p * f) * s; f *= 2; s *= 0.5; } return a; };
function normalFromHeight(hgt, n, strength) {
  return tex(n, n, (g) => {
    const img = g.createImageData(n, n), H = (x, y) => hgt[((y + n) % n) * n + ((x + n) % n)];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const nx = (H(x - 1, y) - H(x + 1, y)) * strength, ny = (H(x, y - 1) - H(x, y + 1)) * strength, l = Math.hypot(nx, ny, 1), i = (y * n + x) * 4;
      img.data[i] = (nx / l * .5 + .5) * 255; img.data[i + 1] = (ny / l * .5 + .5) * 255; img.data[i + 2] = (1 / l * .5 + .5) * 255; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }, { srgb: false });
}

// facade tile: one window bay = 2.4 m wide × 3.2 m storey; 256×320 px
const TW = 256, TH = 320, PXM = TW / 2.4;
function drawBricks(g, w, h, base = [150, 62, 40], bh = 8, bl = 26) {
  g.fillStyle = '#c4b29d'; g.fillRect(0, 0, w, h);
  for (let y = 0, row = 0; y < h; y += bh, row++) for (let x = -(row % 2) * bl / 2; x < w; x += bl) {
    const k = rr(-24, 18), dk = rnd() < 0.08 ? -40 : 0;
    g.fillStyle = `rgb(${base[0] + k + dk},${base[1] + k * .5 + dk * .5},${base[2] + k * .4 + dk * .4})`;
    g.fillRect(x + 1, y + 1, bl - 2, bh - 2);
  }
}
function facade(kind) { // kind: 'plaster' | 'brick' | 'rough' | 'emit'
  return tex(TW, TH, (g) => {
    const wx = TW / 2 - 0.5 * PXM, ww = 1.0 * PXM, wy = TH - 2.55 * PXM, wh = 1.7 * PXM;
    if (kind === 'brick') drawBricks(g, TW, TH);
    else if (kind === 'plaster') {
      g.fillStyle = '#f6f2ea'; g.fillRect(0, 0, TW, TH);
      for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '120,110,95' : '255,255,255'},${rr(.02, .07)})`; g.fillRect(rnd() * TW, rnd() * TH, rr(2, 7), rr(2, 7)); }
      g.fillStyle = 'rgba(0,0,0,.05)'; g.fillRect(0, TH - 4, TW, 4);           // cornice shadow line per storey
    } else if (kind === 'rough') { g.fillStyle = 'rgb(0,235,0)'; g.fillRect(0, 0, TW, TH); }
    else { g.fillStyle = '#000'; g.fillRect(0, 0, TW, TH); }

    if (kind === 'brick') {                       // segmental arch above the window
      g.fillStyle = '#7d2f1f'; g.beginPath(); g.ellipse(TW / 2, wy + 4, ww / 2 + 10, 20, 0, Math.PI, 0); g.fill();
    }
    if (kind === 'plaster') { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(wx - 9, wy - 9, ww + 18, wh + 18); g.fillStyle = '#fbf9f5'; g.fillRect(wx - 7, wy - 7, ww + 14, wh + 14); }
    // sill
    g.fillStyle = kind === 'rough' ? 'rgb(0,170,0)' : kind === 'emit' ? '#000' : '#d9d2c5'; g.fillRect(wx - 8, wy + wh, ww + 16, 7);
    // frame + glass
    if (kind === 'rough') { g.fillStyle = 'rgb(0,60,0)'; g.fillRect(wx, wy, ww, wh); g.fillStyle = 'rgb(0,150,0)'; }
    else if (kind === 'emit') {
      const gr = g.createLinearGradient(0, wy, 0, wy + wh); gr.addColorStop(0, '#ffd59a'); gr.addColorStop(1, '#f0a050');
      g.fillStyle = gr; g.fillRect(wx + 6, wy + 6, ww - 12, wh - 12); g.fillStyle = '#000';
    } else {
      g.fillStyle = '#f4f2ee'; g.fillRect(wx, wy, ww, wh);
      const gr = g.createLinearGradient(wx, wy, wx + ww, wy + wh);
      gr.addColorStop(0, '#5d7486'); gr.addColorStop(.45, '#26333d'); gr.addColorStop(.55, '#7c93a3'); gr.addColorStop(1, '#1d262d');
      g.fillStyle = gr; g.fillRect(wx + 6, wy + 6, ww - 12, wh - 12); g.fillStyle = '#f4f2ee';
    }
    // glazing bars
    g.fillRect(wx + ww / 2 - 3, wy + 6, 6, wh - 12); g.fillRect(wx + 6, wy + wh * .38, ww - 12, 5);
    for (const fy of [.69]) g.fillRect(wx + 6, wy + wh * fy, ww - 12, 3);
  });
}
const T = {
  plaster: facade('plaster'), brick: facade('brick'), rough: facade('rough'), emit: facade('emit'),
};
T.rough.colorSpace = THREE.NoColorSpace;
T.roof = tex(128, 128, (g, w, h) => {          // pantiles, 1 m tile
  g.fillStyle = '#7a2d1c'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) for (let x = 0; x < w; x += 21) {
    const k = rr(-18, 18), gr = g.createLinearGradient(x, 0, x + 21, 0);
    gr.addColorStop(0, `rgb(${150 + k},${60 + k * .4},${38})`); gr.addColorStop(.5, `rgb(${196 + k},${88 + k * .4},${55})`); gr.addColorStop(1, `rgb(${120 + k},${46},${30})`);
    g.fillStyle = gr; g.fillRect(x, y, 20, 30); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x, y + 28, 21, 4);
  }
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '40,40,30' : '120,130,90'},${rr(.05, .15)})`; g.fillRect(rnd() * w, rnd() * h, rr(2, 6), rr(1, 3)); }
});
T.brickPlain = tex(256, 256, (g, w, h) => drawBricks(g, w, h, [140, 58, 38], 9, 28));
T.brickDark = tex(256, 256, (g, w, h) => { drawBricks(g, w, h, [104, 44, 32], 9, 28); g.fillStyle = 'rgba(30,10,5,.15)'; g.fillRect(0, 0, w, h); });
// cobblestone (4 m tile) with matching normal map
{
  const n = 512, hgt = new Float32Array(n * n);
  T.cobble = tex(n, n, (g) => {
    g.fillStyle = '#4b4641'; g.fillRect(0, 0, n, n);
    const hc = document.createElement('canvas'); hc.width = hc.height = n; const hg = hc.getContext('2d');
    hg.fillStyle = '#000'; hg.fillRect(0, 0, n, n);

  let ix = 0, iz = 0;
  if (keys.has('w') || keys.has('arrowup')) iz += 1;
  if (keys.has('s') || keys.has('arrowdown')) iz -= 1;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;
  if (stick.id !== null) { ix += stick.x; iz -= stick.y; }
  let mag = Math.min(1, Math.hypot(ix, iz));
  const run = keys.has('shift') || runToggle || (stick.id !== null && Math.hypot(stick.x, stick.y) > .92);
  const target = mag > 0.05 ? (run ? 6.2 : 2.3) * mag : 0;
  // camera-relative direction
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rxv = -fz, rzv = fx;
  let dx = fx * iz + rxv * ix, dz = fz * iz + rzv * ix; const dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;
  player.speed += (target - player.speed) * (1 - Math.exp(-dt * 8));
  if (mag > 0.05) {
    const want = Math.atan2(dx, dz); let d = want - player.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
    player.yaw += d * (1 - Math.exp(-dt * 10));
  }
  const mvx = Math.sin(player.yaw) * player.speed * dt, mvz = Math.cos(player.yaw) * player.speed * dt;
  let nx = player.x + mvx, nz = player.z + mvz;
  if (!walkable(nx, nz)) { if (walkable(nx, player.z)) nz = player.z; else if (walkable(player.x, nz)) nx = player.x; else { nx = player.x; nz = player.z; } }
  [nx, nz] = resolve(nx, nz, .32, player.y);
  for (const p of peds) { const ddx = nx - p.x, ddz = nz - p.z, d = Math.hypot(ddx, ddz); if (d < .6 && d > 1e-4) { nx = p.x + ddx / d * .6; nz = p.z + ddz / d * .6; } }
  for (const c of [...ringCars, ...townCars]) { const p = c.g.position, ddx = nx - p.x, ddz = nz - p.z; const lx = ddx * Math.cos(c.g.rotation.y) - ddz * Math.sin(c.g.rotation.y), lz = ddx * Math.sin(c.g.rotation.y) + ddz * Math.cos(c.g.rotation.y); if (Math.abs(lx) < 1.25 && Math.abs(lz) < c.L / 2 + .35) { nx = player.x; nz = player.z; } }
  if (walkable(nx, nz)) { player.x = nx; player.z = nz; }
  // jump
  if (keys.has(' ') && player.y <= 0) player.vy = 4.6;
  player.vy -= 12 * dt; player.y = Math.max(0, player.y + player.vy * dt); if (player.y === 0) player.vy = Math.max(0, player.vy);
  player.ph += player.speed * dt * 2.6;
  const amp = Math.min(.75, player.speed * .2);
  const sw = Math.sin(player.ph) * amp;
  player.legL.rotation.x = sw; player.legR.rotation.x = -sw; player.armL.rotation.x = -sw * .8; player.armR.rotation.x = sw * .8;
  player.g.position.set(player.x, player.y + Math.abs(Math.cos(player.ph)) * .03 * Math.min(1, player.speed), player.z);
  player.g.rotation.y = player.yaw;
}

function updateCamera(dt) {
  const head = camTarget.set(player.x, player.y + (firstPerson ? 1.62 : 1.55), player.z);
  if (firstPerson) {
    camera.position.copy(head);
    camera.lookAt(head.x - Math.sin(camYaw), head.y - Math.tan(camPitch * .9), head.z - Math.cos(camYaw));
    return;
  }
  // auto-follow: gently swing the camera behind the walker when moving
  if (player.speed > 0.5 && !drag && look.id === null) { let d = (player.yaw + Math.PI) - camYaw; d = Math.atan2(Math.sin(d), Math.cos(d)); camYaw += d * (1 - Math.exp(-dt * 0.9)); }
  const cp = Math.cos(camPitch), want = camDist;
  let dist = want;
  for (let k = 1; k <= 16; k++) { // pull in if a building is in the way
    const t = want * k / 16, x = head.x + Math.sin(camYaw) * cp * t, y = head.y + Math.sin(camPitch) * t, z = head.z + Math.cos(camYaw) * cp * t;
    if (insideSolid(x, y, z) || (y < 0.25)) { dist = Math.max(1.2, t - want / 16); break; }
  }
  const tx = head.x + Math.sin(camYaw) * cp * dist, ty = Math.max(0.3, head.y + Math.sin(camPitch) * dist), tz = head.z + Math.cos(camYaw) * cp * dist;
  camPos.set(tx, ty, tz);
  if (camera.userData.init) camera.position.lerp(camPos, 1 - Math.exp(-dt * 12)); else { camera.position.copy(camPos); camera.userData.init = true; }
  camera.lookAt(head);
}

function updatePeds(dt) {
  const set = (k, m) => parts[k].setMatrixAt(curPed, m);
  for (curPed = 0; curPed < peds.length; curPed++) {
    const p = peds[curPed], A = nodes[p.a], B = nodes[p.b];
    const L = Math.hypot(B.x - A.x, B.z - A.z), ux = (B.x - A.x) / L, uz = (B.z - A.z) / L;
    const off = streetHalf(A, B) - 1.0;
    // pause if the player stands right in front
    const ahx = p.x + ux * .9, ahz = p.z + uz * .9;
    const blocked = Math.hypot(ahx - player.x, ahz - player.z) < .9;
    const v = blocked ? 0 : p.v;
    p.t += v * dt / L;
    if (p.t >= 1) { p.t -= 1; const prev = p.a; p.a = p.b; const nb = nodes[p.a].nb; p.b = nb.length > 1 ? pick(nb.filter((k) => k !== prev)) : nb[0]; if (rnd() < .15) p.side *= -1; continue; }
    const px = -uz * p.side * off, pz = ux * p.side * off;
    p.x = A.x + (B.x - A.x) * p.t + px; p.z = A.z + (B.z - A.z) * p.t + pz; p.yaw = Math.atan2(ux, uz);
    p.ph += v * dt * 2.6;
    poseHuman(set, p.x, 0, p.z, p.yaw, p.ph, v > 0 ? .5 : 0, p.h);
  }
  for (const k in parts) parts[k].instanceMatrix.needsUpdate = true;
}
let curPed = 0;

function updateVehicles(dt) {
  // ring road: keep distance to the car ahead in the same lane, stop for the player
  for (const c of ringCars) {
    const off = c.lane ? ROAD0 + 3 : ROAD1 - 3, dir = c.lane ? 1 : -1;
    let gap = 1e9;
    for (const o of ringCars) { if (o === c || o.lane !== c.lane) continue; let d = (o.phi - c.phi) * dir; d = ((d % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2); gap = Math.min(gap, d * (outerR(c.phi) + off)); }
    const [x, z] = ringPoint(c.phi, off), [x2, z2] = ringPoint(c.phi + dir * .01, off);
    const hx = (x2 - x), hz = (z2 - z), hl = Math.hypot(hx, hz);
    const front = [x + hx / hl * (c.L / 2 + 3), z + hz / hl * (c.L / 2 + 3)];
    const stop = Math.hypot(front[0] - player.x, front[1] - player.z) < 3.2 || peds.some((p) => Math.hypot(front[0] - p.x, front[1] - p.z) < 2.5);
    const want = stop ? 0 : Math.min(c.vmax, Math.max(0, (gap - 9) * 0.8));
    c.v += (want - c.v) * (1 - Math.exp(-dt * (want < c.v ? 4 : 1.2)));
    c.phi += dir * c.v * dt / (outerR(c.phi) + off);
    c.g.position.set(x, 0, z); c.g.rotation.y = Math.atan2(hx, hz);
    for (const w of c.wheels) w.rotation.x += c.v * dt / .33;
  }
  // old-town cars: loop down one side of the street, back up the other
  for (const c of townCars) {
    const ext = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(XS[c.street]) / RX, SEN)), 1 / SEN), sx = XS[c.street], zTop = -ext * RZN + 30, zBot = ext * RZS - 30;
    const len = (zBot - zTop) * 2;
    const pos = (s) => { s = ((s % 1) + 1) % 1; const d = s * len; return d < len / 2 ? [sx + 2.4, zTop + d, 0] : [sx - 2.4, zBot - (d - len / 2), Math.PI]; };
    const [x, z, yaw] = pos(c.s), hz = Math.cos(yaw), front = [x, z + hz * (c.L / 2 + 2.5)];
    const stop = Math.hypot(front[0] - player.x, front[1] - player.z) < 3 || peds.some((p) => Math.hypot(front[0] - p.x, front[1] - p.z) < 2) || bikes.some((b) => Math.hypot(front[0] - b.g.position.x, front[1] - b.g.position.z) < 2.5);
    c.v += ((stop ? 0 : c.vmax) - c.v) * (1 - Math.exp(-dt * 3));
    c.s += c.v * dt / len;
    c.g.position.set(x, 0, z); c.g.rotation.y = yaw;
    for (const w of c.wheels) w.rotation.x += c.v * dt / .33;
  }
  // cyclists on the street graph, riding on the right
  for (const b of bikes) {
    const A = nodes[b.a], B = nodes[b.b2], L = Math.hypot(B.x - A.x, B.z - A.z), ux = (B.x - A.x) / L, uz = (B.z - A.z) / L;
    const x0 = A.x + (B.x - A.x) * b.t - uz * 1.3, z0 = A.z + (B.z - A.z) * b.t + ux * 1.3;
    const blocked = Math.hypot(x0 + ux * 2 - player.x, z0 + uz * 2 - player.z) < 1.6;
    const v = blocked ? 0 : b.v;
    b.t += v * dt / L;
    if (b.t >= 1) { b.t -= 1; const prev = b.a; b.a = b.b2; const nb = nodes[b.a].nb; b.b2 = nb.length > 1 ? pick(nb.filter((k) => k !== prev)) : nb[0]; }
    b.g.position.set(x0, 0, z0); b.g.rotation.y = Math.atan2(ux, uz);
    for (const w of b.wheels) w.rotation.x += v * dt / .34;
    b.crank += v * dt * 1.8; b.legs[0].rotation.x = Math.sin(b.crank) * .7 - .3; b.legs[1].rotation.x = -Math.sin(b.crank) * .7 - .3;
  }
  // boats
  for (const b of boats) {
    const r = (p) => (islandR(p) + outerR(p)) / 2 - 6 * b.dir;
    b.phi += b.dir * 3.2 * dt / r(b.phi);
    const [x, z] = polarPt(b.phi, r(b.phi)), [x2, z2] = polarPt(b.phi + b.dir * .01, r(b.phi + b.dir * .01));
    b.g.position.set(x, -2.5 + Math.sin(simT * 1.3 + b.phi) * .05, z); b.g.rotation.y = Math.atan2(x2 - x, z2 - z);
  }
  SHIP.position.y = -1.6 + Math.sin(simT * .7) * .08; SHIP.rotation.z = Math.sin(simT * .5) * .01;
  // train every ~70 s
  TRAIN.z += 22 * dt; if (TRAIN.z > 1500) TRAIN.z = -1500 - 600;
  TRAIN.g.position.set(-640, 0, TRAIN.z);
  // gulls
  for (const gl of gulls) {
    gl.ph += dt * gl.sp; const x = gl.c[0] + Math.cos(gl.ph) * gl.rad, z = gl.c[1] + Math.sin(gl.ph) * gl.rad;
    gl.g.position.set(x, gl.h + Math.sin(gl.ph * 3) * 2, z); gl.g.rotation.y = Math.atan2(-Math.sin(gl.ph) * Math.sign(gl.sp), Math.cos(gl.ph) * Math.sign(gl.sp));
    const f = Math.sin(simT * 7 + gl.ph * 20) * .5; gl.l.rotation.z = f; gl.r.rotation.z = -f;
  }
  MILL.hub.rotation.z += dt * 0.75;
}

function updatePlace() {
  let best = null, bd = 1e9;
  for (const p of PLACES) { const d = Math.hypot(player.x - p.x, player.z - p.z); if (d < p.r && d < bd) { bd = d; best = p; } }
  if (best !== placeShown) {
    placeShown = best;
    if (best) { $('#pDe').textContent = best.de; $('#pZh').textContent = best.zh; $('#pYr').textContent = best.yr; $('#pTx').textContent = best.tx; }
    $('#place').classList.toggle('on', !!best);
  }
  if ($('#bigmap').classList.contains('on')) { const d = $('#bigDot'); d.style.left = ((player.x + IMG_CX) / 1672 * 100) + '%'; d.style.top = ((player.z + IMG_CY) / 941 * 100) + '%'; }
}

let frameN = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); simT += dt;
  if (started) updatePlayer(dt);
  updateCamera(dt);
  updatePeds(dt); updateVehicles(dt);
  windU.uTime.value = simT;
  T.waterN.offset.set(simT * .004, simT * .006);
  clouds.material.map.offset.x = simT * .0006;
  sun.position.set(player.x + sunDir.x * 300, sunDir.y * 300, player.z + sunDir.z * 300); sun.target.position.set(player.x, 0, player.z);
  sky.position.copy(camera.position); clouds.position.x = camera.position.x; clouds.position.z = camera.position.z;
  if ((frameN++ & 3) === 0) { drawMini(); updatePlace(); }
  composer ? composer.render() : renderer.render(scene, camera);
}
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer?.setSize(innerWidth, innerHeight); bloomPass?.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

/* ---------------- boot ---------------- */
status(`已建好 ${houseCount} 棟房子、${PED_N} 位行人`);
requestAnimationFrame(frame);
$('#go').disabled = false; $('#go').focus();
$('#go').addEventListener('click', () => { started = true; $('#intro').classList.add('off'); canvas.focus(); });
window.__lub = { player, start: () => { started = true; $('#intro').classList.add('off'); }, setTime: (i) => { timeIdx = i; applyTime(i); }, teleport: (x, z, yaw) => { player.x = x; player.z = z; if (yaw !== undefined) { player.yaw = yaw; camYaw = yaw + Math.PI; } }, setCam: (y, p, d) => { camYaw = y; camPitch = p; camDist = d; } };
</script>
