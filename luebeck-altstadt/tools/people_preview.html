<!doctype html><html><body style="margin:0;background:#cfd8e0">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createMannequin, PLAYER_LOOK, randomLook } from '../js/mannequin.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0xcfd8e0); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3, 6, 5); d.castShadow = true; s.add(d, new THREE.HemisphereLight(0xdde8ff, 0x665544, 0.6));
const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x9a948c })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; s.add(fl);
const q = new URLSearchParams(location.search), close = q.get('close');
const looks = close ? [PLAYER_LOOK] : [PLAYER_LOOK, ...Array.from({ length: 6 }, randomLook)];
looks.forEach((lk, i) => { const h = createMannequin(s, lk); h.root.position.x = (i - (looks.length - 1) / 2) * 0.75; h.mixer.update(i === 2 ? 0.4 : 0.1); if (i % 3 === 1) { h.A.idle.setEffectiveWeight(0); h.A.walk.setEffectiveWeight(1); h.mixer.update(0.3); } });
const c = new THREE.PerspectiveCamera(close ? 22 : 30, innerWidth / innerHeight, 0.05, 50);
if (close) { c.position.set(0.25, 1.62, 1.1); c.lookAt(0, 1.55, 0); } else { c.position.set(0, 1.3, 7); c.lookAt(0, 0.9, 0); }
r.render(s, c); window.done = true;
</script></body></html>
