<!doctype html><html><body style="margin:0;background:#cfe0ef">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeEagle } from '../js/eagle.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0xcfe0ef);
s.add(new THREE.HemisphereLight(0xdde8ff, 0x665544, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(3, 8, 6); s.add(d);
const pm = new THREE.PMREMGenerator(r); s.environment = pm.fromScene(new (await import('three/addons/environments/RoomEnvironment.js')).RoomEnvironment(), 0.04).texture;
const e = makeEagle(s); e.g.visible = true; e.animate(0.3, Number(new URLSearchParams(location.search).get('amp') ?? 0.2), 0); e.g.rotation.x = 0.1;
const c = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100); const v = (new URLSearchParams(location.search).get('v') || '0,2,14').split(',').map(Number); c.position.set(...v); c.lookAt(0, 0.3, 0.5);
r.render(s, c); window.done = true;
</script></body></html>
